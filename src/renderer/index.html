<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
  />
  <title>Study Pet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="pet" class="group/pet flex h-full w-full flex-col items-center justify-end gap-1.5 pb-2.5">
    <div id="stage" class="relative">
      <button
        id="close-btn"
        class="hit-ui pointer-events-none absolute -top-1 -right-1 z-10 grid size-[22px] cursor-pointer place-items-center rounded-full bg-zinc-800/85 text-[15px] leading-none text-white opacity-0 transition hover:bg-red-500 group-[.hovering]/pet:pointer-events-auto group-[.hovering]/pet:opacity-100"
        title="펫 끄기"
      >×</button>
    </div>
    <div
      id="timer"
      class="invisible pointer-events-none min-w-[58px] rounded-full bg-zinc-900/80 px-2.5 py-0.5 text-center text-xs text-white tabular-nums"
    >00:00</div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
