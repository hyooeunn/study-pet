<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
  />
  <title>내 캐릭터</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#fff7f2] text-stone-800">
  <main class="flex h-full">
    <section class="flex w-[44%] flex-col items-center justify-center gap-4 bg-[#ffe9df]">
      <div id="stage" class="relative"></div>
      <p id="preview-name" class="h-7 min-w-16 rounded-full bg-white/80 px-3 text-center text-sm leading-7 font-semibold text-stone-600 empty:invisible"></p>
    </section>

    <form id="form" class="flex flex-1 flex-col gap-6 px-8 py-8" autocomplete="off">
      <div>
        <h1 id="title" class="text-xl font-bold">내 캐릭터 만들기</h1>
        <p id="subtitle" class="mt-1 text-sm text-stone-500">친구들에게 보일 모습을 골라 줘</p>
      </div>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-semibold">닉네임</span>
        <input
          id="nickname"
          class="rounded-xl border-2 border-stone-200 bg-white px-4 py-2.5 outline-none select-text focus:border-orange-300"
          placeholder="이름을 적어 줘"
          spellcheck="false"
        />
      </label>

      <fieldset class="flex flex-col">
        <legend class="mb-3 text-sm font-semibold">머리색</legend>
        <div id="hair-colors" class="flex items-center gap-2.5"></div>
      </fieldset>

      <fieldset class="flex flex-col">
        <legend class="mb-3 text-sm font-semibold">피부색</legend>
        <div id="skin-colors" class="flex items-center gap-2.5"></div>
      </fieldset>

      <!-- 악세사리를 착용하고 있을 때만 보임 -->
      <fieldset id="accessory-field" class="hidden flex-col">
        <legend class="mb-3 text-sm font-semibold">악세사리 색</legend>
        <div id="accessory-colors" class="flex items-center gap-2"></div>
      </fieldset>

      <button
        id="submit"
        type="submit"
        class="mt-auto cursor-pointer rounded-xl bg-orange-400 py-3 font-bold text-white transition hover:bg-orange-500 disabled:cursor-not-allowed disabled:opacity-40"
        disabled
      >완료</button>
    </form>
  </main>

  <script type="module" src="setup.js"></script>
</body>
</html>
